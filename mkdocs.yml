site_name: NEMO Demonstrators
site_description: Demonstrators and recipes for NEMO ocean model experiments
site_url: https://justinebuisson606.github.io/NEMO_Demonstrators/
repo_url: https://github.com/justinebuisson606/NEMO_Demonstrators
repo_name: NEMO_Demonstrators
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Getting started: index.md
  - User Guide:
      - Overview: user_guide/index.md
      - Experiments: user_guide/experiments.md
  - Run it yourself: run_yourself.md
  - Demonstrators:
      - Summary: demonstrators.md
      - Diffusive and dispersive properties of the tracer advection schemes : notebooks/demonstrator_1.ipynb
      - Qualitative comparison of performances based on spatial resolution : notebooks/demonstator_1-gauss.ipynb
      - Diffusive and dispersive tracer advection schemes on eddies : notebooks/demonstrator_2.ipynb
      - Impact of explicit tracer diffusion schemes over a dispersive tracer advection scheme : notebooks/demonstrator_3.ipynb
      - Annex 1: notebooks/annex_1.ipynb
      - Annex 3: notebooks/annex_3-a.ipynb
  - Methodology : recipes/index.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/collapse.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
